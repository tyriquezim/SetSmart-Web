# Netlify build for the web app (https://setsmart.netlify.app).
# Environment variables (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_USDA_API_KEY)
# are set in the Netlify dashboard, not here: they're read at build time.

[build]
  # Install runs at the repo root so the npm workspaces (apps/web + packages/core) link up.
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# The app does its own routing, so serve index.html for any path that isn't a real
# file (otherwise refreshing /food or opening a shared link gives a 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The barcode scanner needs the camera; nothing else does.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Built files have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
